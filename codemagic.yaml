workflows:
  android-development:
    name: Android - Development
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      android_signing:
        - keystore_reference
      flutter: fvm
      vars:
        FIREBASE_PROJECT_ID: "white-label-financeapp-b274a"
        ENVIRONMENT: "development"
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter packages
        script: flutter pub get
      - name: Flutter analyze
        script: flutter analyze
      - name: Apply tenant branding
        script: |
          chmod +x "$CM_BUILD_DIR/scripts/set_tenant_branding.sh"
          "$CM_BUILD_DIR/scripts/set_tenant_branding.sh"
      - name: Generate tenant env file
        script: |
          mkdir -p "$CM_BUILD_DIR/.env"
          jq -n \
            --arg ENVIRONMENT "${ENVIRONMENT}" \
            --arg SERVER_ADDRESS "${SERVER_ADDRESS}" \
            --arg TENANT_ID "${TENANT_ID}" \
            --arg APP_NAME "${APP_NAME}" \
            --arg PRIMARY_COLOR "${PRIMARY_COLOR:-FF1B5E20}" \
            --arg ACCENT_COLOR "${ACCENT_COLOR:-FFFFD600}" \
            --arg ERROR_COLOR "${ERROR_COLOR:-FFEB2E25}" \
            --arg PACKAGE_NAME "${PACKAGE_NAME}" \
            --arg FIREBASE_ANDROID_API_KEY "${FIREBASE_ANDROID_API_KEY}" \
            --arg FIREBASE_ANDROID_APP_ID "${FIREBASE_ANDROID_APP_ID}" \
            --arg FIREBASE_IOS_API_KEY "${FIREBASE_IOS_API_KEY}" \
            --arg FIREBASE_IOS_APP_ID "${FIREBASE_IOS_APP_ID}" \
            --arg FIREBASE_IOS_BUNDLE_ID "${FIREBASE_IOS_BUNDLE_ID}" \
            --arg FIREBASE_MESSAGING_SENDER_ID "${FIREBASE_MESSAGING_SENDER_ID}" \
            --arg FIREBASE_TENANT_PROJECT_ID "${FIREBASE_TENANT_PROJECT_ID}" \
            --arg FIREBASE_STORAGE_BUCKET "${FIREBASE_STORAGE_BUCKET}" \
            --arg FEATURE_THEME_CHANGE "${FEATURE_THEME_CHANGE:-true}" \
            --arg FEATURE_LANGUAGE "${FEATURE_LANGUAGE:-true}" \
            --arg FEATURE_ACCOUNT_BALANCE "${FEATURE_ACCOUNT_BALANCE:-true}" \
            --arg FEATURE_PAYMENTS "${FEATURE_PAYMENTS:-true}" \
            --arg FEATURE_CARDS "${FEATURE_CARDS:-true}" \
            --arg FEATURE_ANALYTICS "${FEATURE_ANALYTICS:-true}" \
            '{
              ENVIRONMENT: $ENVIRONMENT,
              SERVER_ADDRESS: $SERVER_ADDRESS,
              TENANT_ID: $TENANT_ID,
              APP_NAME: $APP_NAME,
              PRIMARY_COLOR: $PRIMARY_COLOR,
              ACCENT_COLOR: $ACCENT_COLOR,
              ERROR_COLOR: $ERROR_COLOR,
              PACKAGE_NAME: $PACKAGE_NAME,
              FIREBASE_ANDROID_API_KEY: $FIREBASE_ANDROID_API_KEY,
              FIREBASE_ANDROID_APP_ID: $FIREBASE_ANDROID_APP_ID,
              FIREBASE_IOS_API_KEY: $FIREBASE_IOS_API_KEY,
              FIREBASE_IOS_APP_ID: $FIREBASE_IOS_APP_ID,
              FIREBASE_IOS_BUNDLE_ID: $FIREBASE_IOS_BUNDLE_ID,
              FIREBASE_MESSAGING_SENDER_ID: $FIREBASE_MESSAGING_SENDER_ID,
              FIREBASE_TENANT_PROJECT_ID: $FIREBASE_TENANT_PROJECT_ID,
              FIREBASE_STORAGE_BUCKET: $FIREBASE_STORAGE_BUCKET,
              FEATURE_THEME_CHANGE: $FEATURE_THEME_CHANGE,
              FEATURE_LANGUAGE: $FEATURE_LANGUAGE,
              FEATURE_ACCOUNT_BALANCE: $FEATURE_ACCOUNT_BALANCE,
              FEATURE_PAYMENTS: $FEATURE_PAYMENTS,
              FEATURE_CARDS: $FEATURE_CARDS,
              FEATURE_ANALYTICS: $FEATURE_ANALYTICS
            }' > "$CM_BUILD_DIR/.env/tenant.env"
# flutter build appbundle --release ! OVO koristi za produkciju
      - name: Build APK with Flutter
        script: |
          flutter build apk --release \
            --dart-define-from-file=.env/tenant.env \
            --build-name=1.0.0 \
            --build-number=$(($(date +%s) / 60))
    artifacts:
      - build/**/outputs/**/*.apk
      # - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - bokimilicevic.poslovni@gmail.com
        notify:
          success: true
          failure: true

